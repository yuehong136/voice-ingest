# Dedicated disposable resources. Does not read .env or join application networks.
name: voice-ingest-phase1-tests
x-source: &source
  - ../src:/app/src:ro
  - ../tests:/app/tests:ro
  - ../migrations:/app/migrations:ro
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice_test
      POSTGRES_PASSWORD: isolated-test-password
      POSTGRES_DB: voice_test
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U voice_test -d voice_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data
    ports: ["127.0.0.1:19039:9000"]
    environment:
      MINIO_ROOT_USER: isolated-test
      MINIO_ROOT_PASSWORD: isolated-test-password
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:5174
  browser:
    image: voice-ingest-phase1-tests-tests
    command: ["uv", "run", "python", "tests/browser_backend.py"]
    profiles: [browser]
    volumes: *source
    ports: ["127.0.0.1:18089:18080"]
    environment:
      VOICE_PROVIDER: mock
      VOICE_DATABASE_URL: postgresql+asyncpg://voice_test:isolated-test-password@postgres:5432/voice_test
      VOICE_API_KEY: browser-test-key
      VOICE_S3_ENDPOINT: http://s3:9000
      VOICE_S3_PUBLIC_ENDPOINT: http://127.0.0.1:19039
      VOICE_S3_BUCKET: voice-browser-test
      VOICE_S3_ACCESS_KEY: isolated-test
      VOICE_S3_SECRET_KEY: isolated-test-password
      VOICE_POLL_SECONDS: 0.1
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_started}
  tests:
    volumes: *source
    build:
      context: ..
      dockerfile: deploy/Dockerfile.test
    environment:
      VOICE_TEST_DATABASE_URL: postgresql+asyncpg://voice_test:isolated-test-password@postgres:5432/voice_test
      VOICE_TEST_S3_ENDPOINT: http://s3:9000
      VOICE_TEST_S3_ACCESS_KEY: isolated-test
      VOICE_TEST_S3_SECRET_KEY: isolated-test-password
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_started}
