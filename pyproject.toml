[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "voice-ingest"
version = "0.1.0"
description = "Durable audio transcription for people, Python clients and agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.12,<3", "httpx>=0.28,<1"]

[project.urls]
Repository = "https://github.com/yuehong136/voice-ingest"
Issues = "https://github.com/yuehong136/voice-ingest/issues"

[project.optional-dependencies]
cli = ["typer>=0.16,<1"]
server = ["fastapi>=0.135.2,<1", "uvicorn>=0.35,<1", "sqlalchemy[asyncio]>=2.0.40,<2.1", "asyncpg>=0.30,<1", "alembic>=1.16,<2", "pydantic-settings>=2.10,<3", "boto3>=1.40,<2"]
mcp = ["fastmcp==4.0.2"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.0,<2", "ruff>=0.12,<1", "pyright>=1.1.403,<2", "aiosqlite>=0.21,<1", "moto[server]>=5.1,<6"]

[project.scripts]
voice-ingest = "voice_ingest.interfaces.cli:main"
voice-ingest-server = "voice_ingest.runtime.main:serve"
voice-ingest-worker = "voice_ingest.runtime.main:worker"
voice-ingest-mcp = "voice_ingest.interfaces.local_mcp:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires dedicated PostgreSQL and S3 services"]

[tool.ruff]
extend-exclude = [".local"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_ingest"]
